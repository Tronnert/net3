---
- name: Configure two MikroTik CHR devices
  hosts: chr
  gather_facts: false
  vars:
    ntp_servers:
      - ntp.ix.ru
      - ntp1.vniiftri.ru
    ospf_router_id: "{{ ansible_host }}"
    ospf_networks:
      - network: 192.168.1.0/24
        area: backbone

  tasks:
    - name: Ensure admin user exists with password
      community.routeros.api_modify:
        hostname: "{{ ansible_host }}"
        username: "{{ ansible_user }}"
        password: "{{ ansible_password }}"
        path: user
        data:
          - name: admin
            password: "123"
            group: full

    - name: Enable NTP client and set servers
      community.routeros.api_modify:
        hostname: "{{ ansible_host }}"
        username: "{{ ansible_user }}"
        password: "{{ ansible_password }}"
        path: system ntp client
        data:
          - enabled: true
            mode: unicast
            servers: "{{ ntp_servers | join(',') }}"

    - name: Create OSPF instance with Router ID
      community.routeros.api_modify:
        hostname: "{{ ansible_host }}"
        username: "{{ ansible_user }}"
        password: "{{ ansible_password }}"
        path: routing ospf instance
        data:
          - name: default
            router-id: "{{ ospf_router_id }}"
            version: 2
            disabled: false

    - name: Add OSPF networks
      community.routeros.api_modify:
        hostname: "{{ ansible_host }}"
        username: "{{ ansible_user }}"
        password: "{{ ansible_password }}"
        path: routing ospf area
        data:
          - name: backbone
            instance: default
            area-id: 0.0.0.0

    - name: Add OSPF interface templates
      community.routeros.api_modify:
        hostname: "{{ ansible_host }}"
        username: "{{ ansible_user }}"
        password: "{{ ansible_password }}"
        path: routing ospf interface-template
        data:
          - areas: backbone
            interfaces: ether1
            network: "{{ item.network }}"
      loop: "{{ ospf_networks }}"

    - name: Gather OSPF topology facts
      community.routeros.facts:
        gather_subset:
          - routing
      register: ospf_facts

    - name: Gather full configuration
      community.routeros.facts:
        gather_subset:
          - config
      register: config_facts

    - name: Save OSPF topology to file
      ansible.builtin.copy:
        content: "{{ ospf_facts | to_nice_json }}"
        dest: "./output/{{ inventory_hostname }}_ospf_topology.json"

    - name: Save full config to file
      ansible.builtin.copy:
        content: "{{ config_facts | to_nice_json }}"
        dest: "./output/{{ inventory_hostname }}_full_config.json"
